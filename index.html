<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬網域郵件</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 200px; background: #f4f5f7; padding: 20px; border-right: 1px solid #ddd; }
        .sidebar button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; cursor: pointer; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        .email-list { border: 1px solid #ddd; height: 300px; overflow-y: auto; margin-bottom: 20px; padding: 10px; }
        .compose-area { border: 1px solid #ddd; padding: 20px; background: #fafafa; }
        .compose-area input, .compose-area textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- 左側選單 -->
    <div class="sidebar">
        <h2>我的信箱</h2>
        <button onclick="showCompose()">撰寫新郵件</button>
        <button onclick="fetchEmails()">收件匣</button>
        <button>寄件備份</button>
    </div>

    <!-- 右側主要內容區 -->
    <div class="main-content">
        
        <!-- 收件匣列表 -->
        <div id="inbox-view">
            <h3>收件匣</h3>
            <div class="email-list" id="emailList">
                <!-- 這裡的內容需要透過 JavaScript 與後端 API 動態生成 -->
                <p>載入中...</p>
            </div>
        </div>

        <!-- 寫信區塊 -->
        <div id="compose-view" class="compose-area" style="display: none;">
            <h3>撰寫新郵件</h3>
            <form id="composeForm">
                <input type="email" id="toEmail" placeholder="收件人 (例如: example@test.com)" required>
                <input type="text" id="subject" placeholder="主旨" required>
                <textarea id="body" rows="6" placeholder="信件內容..." required></textarea>
                <button type="submit">發送郵件</button>
            </form>
        </div>

    </div>

    <script>
        // 切換顯示寫信介面
        function showCompose() {
            document.getElementById('inbox-view').style.display = 'none';
            document.getElementById('compose-view').style.display = 'block';
        }

        // 模擬呼叫後端 API 獲取信件的邏輯
        function fetchEmails() {
            document.getElementById('inbox-view').style.display = 'block';
            document.getElementById('compose-view').style.display = 'none';
            
            // 實際應用中，這裡會使用 fetch() 呼叫您的後端伺服器
            document.getElementById('emailList').innerHTML = `
                <div style="border-bottom: 1px solid #eee; padding: 5px 0;">
                    <strong>來自: service@example.com</strong> <br>
                    主旨: 歡迎使用專屬信箱系統
                </div>
            `;
        }

        // 處理寄信表單提交
        document.getElementById('composeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const to = document.getElementById('toEmail').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;

            // 實際應用中，這裡會將資料打包成 JSON，並發送 POST 請求到您的後端
            alert(`準備發送給: ${to}\n主旨: ${subject}\n\n(此為前端展示，需串接後端才能真實寄出)`);
        });
    </script>
</body>
</html>
